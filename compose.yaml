name: job-application-agent

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-job_agent}
      POSTGRES_USER: ${POSTGRES_USER:-job_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-job_agent_local_change_me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [job-agent]

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SERVER_PORT: 8080
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-job_agent}
      DATABASE_USERNAME: ${POSTGRES_USER:-job_agent}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-job_agent_local_change_me}
      ALLOWED_FRONTEND_ORIGIN: ${ALLOWED_FRONTEND_ORIGIN:-http://localhost:3000}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:-local_n8n_change_me}
      APP_SECURITY_USERNAME: ${APP_SECURITY_USERNAME:-jobagent}
      APP_SECURITY_PASSWORD: ${APP_SECURITY_PASSWORD:-local_app_password_change_me}
      RESUME_MAX_SIZE_BYTES: ${RESUME_MAX_SIZE_BYTES:-5242880}
      JOB_DESCRIPTION_MAX_CHARACTERS: ${JOB_DESCRIPTION_MAX_CHARACTERS:-100000}
      JOB_SOURCE_MAX_RESPONSE_BYTES: ${JOB_SOURCE_MAX_RESPONSE_BYTES:-5242880}
      JOB_SOURCE_CONNECT_TIMEOUT_MILLIS: ${JOB_SOURCE_CONNECT_TIMEOUT_MILLIS:-3000}
      JOB_SOURCE_REQUEST_TIMEOUT_MILLIS: ${JOB_SOURCE_REQUEST_TIMEOUT_MILLIS:-10000}
      JOB_SOURCE_MAX_RETRIES: ${JOB_SOURCE_MAX_RETRIES:-2}
      JOB_SOURCE_RETRY_BASE_DELAY_MILLIS: ${JOB_SOURCE_RETRY_BASE_DELAY_MILLIS:-250}
      JOB_SOURCE_EXECUTOR_CORE_SIZE: ${JOB_SOURCE_EXECUTOR_CORE_SIZE:-2}
      JOB_SOURCE_EXECUTOR_MAX_SIZE: ${JOB_SOURCE_EXECUTOR_MAX_SIZE:-4}
      JOB_SOURCE_EXECUTOR_QUEUE_CAPACITY: ${JOB_SOURCE_EXECUTOR_QUEUE_CAPACITY:-50}
      JOB_SOURCE_STALE_RUN_MINUTES: ${JOB_SOURCE_STALE_RUN_MINUTES:-30}
      JOBSPY_ALLOWED_SITES: ${JOBSPY_ALLOWED_SITES:-}
      AI_EVALUATION_ENABLED: ${AI_EVALUATION_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_TIMEOUT: ${OPENROUTER_TIMEOUT:-120s}
      OPENROUTER_MAX_RETRIES: ${OPENROUTER_MAX_RETRIES:-1}
      OPENROUTER_HTTP_REFERER: ${OPENROUTER_HTTP_REFERER:-http://localhost:3000}
      OPENROUTER_APP_TITLE: ${OPENROUTER_APP_TITLE:-Job Application Agent}
      OPENROUTER_ALLOW_DATA_COLLECTION: ${OPENROUTER_ALLOW_DATA_COLLECTION:-false}
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGINGFACE_BASE_URL: ${HUGGINGFACE_BASE_URL:-https://router.huggingface.co/v1}
      HUGGINGFACE_TIMEOUT: ${HUGGINGFACE_TIMEOUT:-180s}
      HUGGINGFACE_MAX_RETRIES: ${HUGGINGFACE_MAX_RETRIES:-0}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-terra}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-low}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-30}
      AI_MAX_CONCURRENT_REQUESTS: ${AI_MAX_CONCURRENT_REQUESTS:-2}
      AI_MAX_DAILY_REQUESTS: ${AI_MAX_DAILY_REQUESTS:-100}
      AI_MAX_DAILY_INPUT_TOKENS: ${AI_MAX_DAILY_INPUT_TOKENS:-500000}
      AI_MAX_INPUT_CHARACTERS: ${AI_MAX_INPUT_CHARACTERS:-50000}
      AI_MAX_JOBS_PER_BATCH: ${AI_MAX_JOBS_PER_BATCH:-25}
      APPLICATION_PACKAGE_AUTOMATION_ENABLED: ${APPLICATION_PACKAGE_AUTOMATION_ENABLED:-false}
      CONTENT_GENERATION_PROVIDER: ${CONTENT_GENERATION_PROVIDER:-openai}
      CONTENT_GENERATION_ENABLED: ${CONTENT_GENERATION_ENABLED:-${OPENAI_CONTENT_GENERATION_ENABLED:-false}}
      CONTENT_GENERATION_MODEL: ${CONTENT_GENERATION_MODEL:-${OPENAI_CONTENT_GENERATION_MODEL:-gpt-5.6-terra}}
      CONTENT_GENERATION_REASONING_EFFORT: ${CONTENT_GENERATION_REASONING_EFFORT:-${OPENAI_CONTENT_GENERATION_REASONING_EFFORT:-low}}
      CONTENT_GENERATION_TIMEOUT: ${CONTENT_GENERATION_TIMEOUT:-${OPENAI_CONTENT_GENERATION_TIMEOUT:-30s}}
      CONTENT_GENERATION_MAX_RETRIES: ${CONTENT_GENERATION_MAX_RETRIES:-${OPENAI_CONTENT_GENERATION_MAX_RETRIES:-1}}
      OPENAI_CONTENT_GENERATION_ENABLED: ${OPENAI_CONTENT_GENERATION_ENABLED:-false}
      OPENAI_CONTENT_GENERATION_MODEL: ${OPENAI_CONTENT_GENERATION_MODEL:-gpt-5.6-terra}
      OPENAI_CONTENT_GENERATION_REASONING_EFFORT: ${OPENAI_CONTENT_GENERATION_REASONING_EFFORT:-low}
      OPENAI_CONTENT_GENERATION_TIMEOUT: ${OPENAI_CONTENT_GENERATION_TIMEOUT:-30s}
      OPENAI_CONTENT_GENERATION_MAX_RETRIES: ${OPENAI_CONTENT_GENERATION_MAX_RETRIES:-1}
      CONTENT_GENERATION_DAILY_LIMIT: ${CONTENT_GENERATION_DAILY_LIMIT:-20}
      CONTENT_GENERATION_MAX_INPUT_TOKENS: ${CONTENT_GENERATION_MAX_INPUT_TOKENS:-24000}
      CONTENT_GENERATION_MAX_OUTPUT_TOKENS: ${CONTENT_GENERATION_MAX_OUTPUT_TOKENS:-8000}
      CONTENT_GENERATION_MAX_INPUT_CHARACTERS: ${CONTENT_GENERATION_MAX_INPUT_CHARACTERS:-60000}
      CONTENT_GENERATION_PROMPT_VERSION: ${CONTENT_GENERATION_PROMPT_VERSION:-v1}
      CONTENT_GENERATION_SCHEMA_VERSION: ${CONTENT_GENERATION_SCHEMA_VERSION:-v1}
      RESUME_TEMPLATE_VERSION: ${RESUME_TEMPLATE_VERSION:-master-resume-classic-v2}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-600s}
      OLLAMA_MAX_RETRIES: ${OLLAMA_MAX_RETRIES:-0}
      OLLAMA_CONTEXT_WINDOW: ${OLLAMA_CONTEXT_WINDOW:-4096}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-15m}
      ATS_SCORING_ENABLED: ${ATS_SCORING_ENABLED:-true}
      ATS_SCORING_BASE_URL: ${ATS_SCORING_BASE_URL:-http://ats-scoring-worker:8091}
      ATS_SCORING_TOKEN: ${ATS_SCORING_TOKEN:-local_ats_scoring_token_change_me_32}
      ATS_SCORING_TIMEOUT: ${ATS_SCORING_TIMEOUT:-60s}
      ATS_SCORING_MAX_DOCUMENT_CHARACTERS: ${ATS_SCORING_MAX_DOCUMENT_CHARACTERS:-32000}
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio_local_change_me}
      MINIO_BUCKET: ${MINIO_BUCKET:-job-agent-documents}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      ats-scoring-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [job-agent]

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks: [job-agent]

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_local_change_me}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [job-agent]

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.1.4
    restart: unless-stopped
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-job_agent}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-job_agent_local_change_me}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-local_n8n_encryption_key_change_me}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:-local_n8n_change_me}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Asia/Calcutta}
    ports:
      - "${N8N_PORT:-5678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./automation/n8n-workflows:/workflows:ro
      - ./n8n/workflows:/job-source-workflows:ro
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
      jobspy-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5678/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [job-agent]

  jobspy-worker:
    build: ./jobspy-worker
    restart: unless-stopped
    environment:
      JOBSPY_WORKER_TOKEN: ${JOBSPY_WORKER_TOKEN:-local_jobspy_worker_token_change_me_32}
      JOBSPY_ALLOWED_SITES: ${JOBSPY_ALLOWED_SITES:-}
      JOBSPY_MAX_BODY_BYTES: ${JOBSPY_MAX_BODY_BYTES:-32768}
      JOBSPY_MAX_SITES_PER_REQUEST: ${JOBSPY_MAX_SITES_PER_REQUEST:-2}
      JOBSPY_MAX_RESULTS_PER_SITE: ${JOBSPY_MAX_RESULTS_PER_SITE:-100}
      JOBSPY_REQUEST_TIMEOUT_SECONDS: ${JOBSPY_REQUEST_TIMEOUT_SECONDS:-120}
      JOBSPY_MAX_CONCURRENT_REQUESTS: ${JOBSPY_MAX_CONCURRENT_REQUESTS:-1}
    expose:
      - "8090"
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [job-agent]

  ats-scoring-worker:
    build: ./ats-scoring-worker
    restart: unless-stopped
    environment:
      ATS_SCORING_TOKEN: ${ATS_SCORING_TOKEN:-local_ats_scoring_token_change_me_32}
      ATS_SCORING_MAX_BODY_BYTES: ${ATS_SCORING_MAX_BODY_BYTES:-131072}
      ATS_SCORING_MAX_DOCUMENT_CHARACTERS: ${ATS_SCORING_MAX_DOCUMENT_CHARACTERS:-32000}
      ATS_SCORING_MAX_CONCURRENT_REQUESTS: ${ATS_SCORING_MAX_CONCURRENT_REQUESTS:-1}
      ATS_SCORING_MAX_TOKENS: ${ATS_SCORING_MAX_TOKENS:-2048}
      ATS_MODEL_ID: 0xnbk/nbk-ats-semantic-v1-en
      ATS_MODEL_REVISION: c9f566b05161f5913b8c20a7807017e407247be6
      ATS_MODEL_PATH: /models/nbk-ats-semantic-v1-en
    expose:
      - "8091"
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1536m
    cpus: 2.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/healthz', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
    networks: [job-agent]

volumes:
  postgres_data:
  minio_data:
  n8n_data:

networks:
  job-agent:
    driver: bridge
