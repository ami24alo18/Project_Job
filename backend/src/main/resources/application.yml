spring:
  application:
    name: job-agent-backend
  servlet:
    multipart:
      max-file-size: ${RESUME_MAX_SIZE_BYTES:5242880}B
      max-request-size: ${RESUME_MAX_SIZE_BYTES:5242880}B
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/job_agent}
    username: ${DATABASE_USERNAME:job_agent}
    password: ${DATABASE_PASSWORD:job_agent_local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: job_agent
  flyway:
    default-schema: job_agent
    schemas: job_agent
server:
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
job-agent:
  allowed-frontend-origin: ${ALLOWED_FRONTEND_ORIGIN:http://localhost:5173}
  n8n:
    webhook-secret: ${N8N_WEBHOOK_SECRET:local-n8n-change-me}
  minio:
    url: ${MINIO_URL:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin-change-me}
    bucket: ${MINIO_BUCKET:job-agent-documents}
  security:
    username: ${APP_SECURITY_USERNAME:jobagent}
    password: ${APP_SECURITY_PASSWORD:local-app-password-change-me}
  documents:
    maximum-size-bytes: ${RESUME_MAX_SIZE_BYTES:5242880}
  ingestion:
    maximum-description-characters: ${JOB_DESCRIPTION_MAX_CHARACTERS:100000}
    maximum-response-bytes: ${JOB_SOURCE_MAX_RESPONSE_BYTES:5242880}
    maximum-external-event-bytes: ${EXTERNAL_EVENT_MAX_BYTES:5242880}
    connect-timeout-millis: ${JOB_SOURCE_CONNECT_TIMEOUT_MILLIS:3000}
    request-timeout-millis: ${JOB_SOURCE_REQUEST_TIMEOUT_MILLIS:10000}
    maximum-retries: ${JOB_SOURCE_MAX_RETRIES:2}
    retry-base-delay-millis: ${JOB_SOURCE_RETRY_BASE_DELAY_MILLIS:250}
    executor-core-pool-size: ${JOB_SOURCE_EXECUTOR_CORE_SIZE:2}
    executor-maximum-pool-size: ${JOB_SOURCE_EXECUTOR_MAX_SIZE:4}
    executor-queue-capacity: ${JOB_SOURCE_EXECUTOR_QUEUE_CAPACITY:50}
    stale-run-after-minutes: ${JOB_SOURCE_STALE_RUN_MINUTES:30}
  career-discovery:
    enabled: ${CAREER_SITE_DISCOVERY_ENABLED:true}
    allowed-ports: [443]
    connect-timeout-millis: ${CAREER_SITE_CONNECT_TIMEOUT_MILLIS:3000}
    request-timeout-millis: ${CAREER_SITE_REQUEST_TIMEOUT_MILLIS:10000}
    maximum-redirects: ${CAREER_SITE_MAX_REDIRECTS:3}
    maximum-compressed-bytes: ${CAREER_SITE_MAX_COMPRESSED_BYTES:1048576}
    maximum-decompressed-bytes: ${CAREER_SITE_MAX_DECOMPRESSED_BYTES:2097152}
    maximum-compression-ratio: ${CAREER_SITE_MAX_COMPRESSION_RATIO:20}
    maximum-markup-characters: ${CAREER_SITE_MAX_MARKUP_CHARACTERS:2000000}
    maximum-markup-nodes: ${CAREER_SITE_MAX_MARKUP_NODES:20000}
    maximum-concurrent-requests: ${CAREER_SITE_MAX_CONCURRENT_REQUESTS:2}
    maximum-requests-per-host-per-minute: ${CAREER_SITE_MAX_REQUESTS_PER_HOST_PER_MINUTE:10}
    cache-ttl-seconds: ${CAREER_SITE_CACHE_TTL_SECONDS:300}
  extraction-recipes:
    enabled: ${CAREER_SITE_EXTRACTION_RECIPES_ENABLED:false}
    definitions: []
  jobspy:
    allowed-sites: ${JOBSPY_ALLOWED_SITES:}
  ai:
    enabled: ${AI_EVALUATION_ENABLED:false}
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-5.6-terra}
    reasoning-effort: ${OPENAI_REASONING_EFFORT:low}
    timeout-seconds: ${OPENAI_TIMEOUT_SECONDS:30}
    max-concurrent-requests: ${AI_MAX_CONCURRENT_REQUESTS:2}
    max-daily-requests: ${AI_MAX_DAILY_REQUESTS:100}
    max-daily-input-tokens: ${AI_MAX_DAILY_INPUT_TOKENS:500000}
    max-input-characters: ${AI_MAX_INPUT_CHARACTERS:50000}
    max-jobs-per-batch: ${AI_MAX_JOBS_PER_BATCH:25}
  content-generation:
    enabled: ${CONTENT_GENERATION_ENABLED:${OPENAI_CONTENT_GENERATION_ENABLED:false}}
    provider: ${CONTENT_GENERATION_PROVIDER:openai}
    automation-enabled: ${APPLICATION_PACKAGE_AUTOMATION_ENABLED:false}
    model: ${CONTENT_GENERATION_MODEL:${OPENAI_CONTENT_GENERATION_MODEL:gpt-5.6-terra}}
    reasoning-effort: ${CONTENT_GENERATION_REASONING_EFFORT:${OPENAI_CONTENT_GENERATION_REASONING_EFFORT:low}}
    timeout: ${CONTENT_GENERATION_TIMEOUT:${OPENAI_CONTENT_GENERATION_TIMEOUT:30s}}
    max-retries: ${CONTENT_GENERATION_MAX_RETRIES:${OPENAI_CONTENT_GENERATION_MAX_RETRIES:1}}
    daily-limit: ${CONTENT_GENERATION_DAILY_LIMIT:20}
    max-input-tokens: ${CONTENT_GENERATION_MAX_INPUT_TOKENS:24000}
    max-output-tokens: ${CONTENT_GENERATION_MAX_OUTPUT_TOKENS:8000}
    max-input-characters: ${CONTENT_GENERATION_MAX_INPUT_CHARACTERS:60000}
    prompt-version: ${CONTENT_GENERATION_PROMPT_VERSION:v1}
    schema-version: ${CONTENT_GENERATION_SCHEMA_VERSION:v1}
    template-version: ${RESUME_TEMPLATE_VERSION:master-resume-classic-v2}
  ollama-content-generation:
    base-url: ${OLLAMA_BASE_URL:http://127.0.0.1:11434}
    timeout: ${OLLAMA_TIMEOUT:600s}
    max-retries: ${OLLAMA_MAX_RETRIES:0}
    context-window: ${OLLAMA_CONTEXT_WINDOW:4096}
    keep-alive: ${OLLAMA_KEEP_ALIVE:15m}
  openrouter-content-generation:
    base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
    timeout: ${OPENROUTER_TIMEOUT:120s}
    max-retries: ${OPENROUTER_MAX_RETRIES:1}
    http-referer: ${OPENROUTER_HTTP_REFERER:http://localhost:3000}
    app-title: ${OPENROUTER_APP_TITLE:Job Application Agent}
    allow-data-collection: ${OPENROUTER_ALLOW_DATA_COLLECTION:false}
  huggingface-content-generation:
    base-url: ${HUGGINGFACE_BASE_URL:https://router.huggingface.co/v1}
    timeout: ${HUGGINGFACE_TIMEOUT:180s}
    max-retries: ${HUGGINGFACE_MAX_RETRIES:0}
  ats-scoring:
    enabled: ${ATS_SCORING_ENABLED:true}
    base-url: ${ATS_SCORING_BASE_URL:http://127.0.0.1:8091}
    token: ${ATS_SCORING_TOKEN:}
    timeout: ${ATS_SCORING_TIMEOUT:60s}
    max-document-characters: ${ATS_SCORING_MAX_DOCUMENT_CHARACTERS:32000}
